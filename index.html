<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVEKING4K | Official Website</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#fff;font-family:'Segoe UI',Arial,sans-serif;padding-bottom:40px}
a{color:inherit}
/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(10,10,12,.95);backdrop-filter:blur(10px);border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.logo span{color:#FFD700}
.logo i{color:#FF0000;font-style:normal}
.nav-right{display:flex;gap:12px;align-items:center;font-size:14px}
.live-pill{background:#111;border:1px solid #2a2a2a;padding:7px 13px;border-radius:50px;display:flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;background:#00ff66;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.nav-sub{background:#FF0000;color:#fff;padding:9px 18px;border-radius:50px;font-weight:800;text-decoration:none}
/* HERO - DESKTOP SPLIT */
.hero{max-width:1100px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
.hero-text h1{font-size:64px;line-height:.95;font-weight:900;letter-spacing:-1px}
.hero-text h1 em{color:#FFD700;font-style:normal}
.hero-text h1 i{color:#FF0000;font-style:normal}
.hero-text p{color:#aaa;margin:14px 0 18px;font-size:17px;line-height:1.5}
.stats{display:flex;gap:12px;margin:18px 0;flex-wrap:wrap}
.stat{background:#141418;border:1px solid #222;border-radius:16px;padding:12px 18px;min-width:110px}
.stat b{font-size:24px;display:block;color:#FFD700}
.stat span{font-size:11px;letter-spacing:1.2px;color:#888}
.hero-btns{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.btn-red{background:#FF0000;color:#fff;padding:14px 28px;border-radius:50px;font-weight:800;text-decoration:none;display:inline-block}
.btn-ghost{background:#fff;color:#000;padding:14px 28px;border-radius:50px;font-weight:800;text-decoration:none;display:inline-block}
.hero-video-box{background:#111;border:1px solid #2a2a2a;border-radius:22px;padding:12px}
.hero-video-box label{font-size:12px;letter-spacing:1.5px;color:#FFD700;font-weight:800}
#heroPlayer{width:100%;height:520px;border-radius:16px;border:0;background:#000;margin-top:10px}
.hero-mini{display:flex;gap:10px;margin-top:12px}
.hero-mini a,.hero-mini button{flex:1;padding:12px;border-radius:50px;font-weight:800;border:0;cursor:pointer;text-align:center;text-decoration:none;font-size:14px}
.like-btn{background:#222;color:#fff}
.sub-btn{background:#FF0000;color:#fff}
/* SECTION */
.section{max-width:1100px;margin:30px auto 0;padding:0 20px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.section-head h2{font-size:28px}
.section-head p{color:#888;font-size:14px}
.status{background:#0f2a18;border:1px solid #1e5c32;color:#7dff9e;padding:10px 16px;border-radius:50px;font-size:13px;display:inline-block;margin-bottom:18px}
/* GRID - DESKTOP 2 COLS, PHONE 1 COL */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#141418;border:1px solid #222;border-radius:22px;padding:14px;overflow:hidden}
.card:hover{border-color:#FFD700}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.num{background:#FFD700;color:#000;padding:6px 12px;border-radius:50px;font-weight:800;font-size:12px}
.tag{color:#888;font-size:12px;font-weight:700;letter-spacing:1px}
iframe.video{width:100%;height:480px;border-radius:14px;border:0;background:#000}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button,.actions a{flex:1;padding:12px;border-radius:50px;font-weight:800;border:0;cursor:pointer;text-align:center;text-decoration:none;font-size:14px}
.watch{display:block;text-align:center;margin-top:10px;background:#fff;color:#000;padding:12px;border-radius:50px;font-weight:800;text-decoration:none}
.comments{margin-top:12px;background:#0f0f12;border-radius:14px;padding:12px}
.comments h4{font-size:13px;color:#FFD700;margin-bottom:8px}
.comment-list div{background:#1e1e24;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:14px}
.comment-box{display:flex;gap:8px}
.comment-box input{flex:1;background:#1e1e24;border:0;color:#fff;padding:11px;border-radius:50px;outline:none}
.comment-box button{background:#FFD700;color:#000;border:0;padding:11px 16px;border-radius:50px;font-weight:800}
.footer{max-width:1100px;margin:40px auto 0;padding:20px;text-align:center;color:#666;font-size:13px;border-top:1px solid #1a1a1a}
.float-sub{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FF0000;color:#fff;padding:14px 28px;border-radius:50px;font-weight:800;z-index:90;white-space:nowrap;text-decoration:none;box-shadow:0 10px 30px rgba(255,0,0,.4)}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;padding:20px}
.popup.show{display:flex}
.popup-box{background:#fff;color:#000;border-radius:24px;padding:30px 22px;text-align:center;max-width:380px;width:100%}
.popup-box h2{font-size:28px}
.popup-box h2 span{color:#FFD700}
/* MOBILE */
@media(max-width:768px){
.hero{grid-template-columns:1fr;gap:18px}
.hero-text h1{font-size:46px}
#heroPlayer{height:580px}
.grid{grid-template-columns:1fr}
.nav-right .live-pill{display:none}
.section-head{flex-direction:column;gap:6px;align-items:start}
}
</style>
</head>

<div class="hero-text">
<h1
